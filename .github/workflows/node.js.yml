name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '22.x'

    - name: Install pnpm
      uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      with:
        version: 10

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Cache Cypress binary
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/Cypress
        key: ${{ runner.os }}-cypress-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-cypress-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install Cypress binary
      run: pnpm cypress install

    - name: Lint
      run: pnpm lint

    - name: Build
      run: pnpm build

    - name: Run Jest tests with coverage
      run: pnpm test-headless-cc

    - name: Run Cypress component tests with coverage
      run: pnpm cypress:component:coverage

    - name: Merge coverage reports
      run: |
        # Create merged coverage directory
        mkdir -p coverage/merged
        
        # Copy Jest coverage
        if [ -d "coverage" ] && [ -f "coverage/lcov.info" ]; then
          cp coverage/lcov.info coverage/merged/jest-lcov.info || true
        fi
        
        # Copy Cypress coverage
        if [ -d "coverage/cypress" ] && [ -f "coverage/cypress/lcov.info" ]; then
          cp coverage/cypress/lcov.info coverage/merged/cypress-lcov.info || true
        fi
        
        # Merge coverage files if both exist
        if [ -f "coverage/merged/jest-lcov.info" ] && [ -f "coverage/merged/cypress-lcov.info" ]; then
          npx lcov-result-merger 'coverage/merged/*-lcov.info' coverage/merged/lcov.info
        elif [ -f "coverage/merged/jest-lcov.info" ]; then
          cp coverage/merged/jest-lcov.info coverage/merged/lcov.info
        elif [ -f "coverage/merged/cypress-lcov.info" ]; then
          cp coverage/merged/cypress-lcov.info coverage/merged/lcov.info
        fi

    - name: Run Cypress component tests
      run: pnpm cypress:component

    - name: Security audit
      run: |
        echo "Checking for outdated dependencies..."
        pnpm outdated || true
        echo ""
        echo "Note: pnpm audit endpoint is retired (HTTP 410). Use pnpm outdated instead."

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
      continue-on-error: true
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: test-results
        path: |
          coverage/
          cypress/screenshots/
          cypress/videos/
        retention-days: 30
